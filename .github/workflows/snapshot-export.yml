name: Snapshot VoiceOver - Export

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27]

    steps:
      - uses: actions/checkout@v6

      - name: Open VoiceOver Utility
        run: |
          open -a "VoiceOver Utility"
          sleep 10

      - name: Export VoiceOver preferences
        run: |
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            tell process "VoiceOver Utility"
              set frontmost to true
              keystroke "e" using {shift down, command down}
            end tell
          end tell
          APPLESCRIPT

          sleep 10

      - name: Screenshot export dialog
        run: |
          mkdir -p artifacts
          screencapture -x artifacts/export-dialog.png || true

      - name: Configure export location and save
        run: |
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            repeat with p in application processes
              try
                if exists (button "Save" of entire contents of windows of p) then
                  log "FOUND SAVE IN: " & name of p
                end if
              end try
            end repeat
          end tell
          APPLESCRIPT

          sleep 3

      - name: Screenshot after save
        run: |
          screencapture -x artifacts/after-save.png || true

      - name: Verify exported preferences
        run: |
          test -d "$HOME/Documents/VoiceOver Archive"
          find "$HOME/Documents/VoiceOver Archive" -maxdepth 2 -print

      - name: Copy snapshot
        run: |
          mkdir -p "${{ matrix.os }}/VoiceOver"

          rsync -a \
            "$HOME/Documents/VoiceOver Archive/" \
            "${{ matrix.os }}/VoiceOver/"

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            **/artifacts/**/*

      - name: Cleanup
        if: always()
        run: |
          rm -rf "$HOME/Documents/VoiceOver Archive" || true
          rm -rf artifacts || true

      - name: Commit and create PR
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "feat: update ${{ matrix.os }} voiceover preferences snapshot"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          branch: voiceover-snapshot-${{ matrix.os }}
          branch-suffix: short-commit-hash
          delete-branch: true
          title: "Update VoiceOver Preferences Snapshot: ${{ matrix.os }}"
          body: |
            Automated update.
          assignees: cmorten
          reviewers: cmorten
          draft: false
